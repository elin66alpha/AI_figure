; ---------------------------------------------------------------------------
; stunnel — 给回声服务器做 TLS 终结。规格见 ../../SERVER.md §7.1 / §7.2。
;
;     设备 --wss://<域名>:443 (TLS 1.2, 纯 PSK)--> stunnel --明文--> 127.0.0.1:8765
;
; 为什么是 PSK 而不是 Let's Encrypt 证书:设备侧 mbedTLS 的 in/out 缓冲是
; **编译期钉死的 16 KB + 16 KB**,没有运行期旋钮(查 arduino-esp32 3.3.12 的
; 预编译 sdkconfig 核实过)。150 KB 可用堆上叠 X.509 解析峰值只剩很薄的余量;
; 纯 PSK 省掉解析峰值和证书常驻,~87 KB -> ~67 KB。而且预共享密钥本身就是设备身份,
; 还不用管证书过期 —— 这台设备没有便捷的远程升级通道。
;
; 装到 /etc/stunnel/esp32.conf,配套 unit 是 stunnel-esp32.service。
; **故意不用 Debian 打包的 stunnel4 服务**:那个的 Type / ENABLED 开关在各版本间
; 不一致,和这里的 foreground=yes 容易打架。自带 unit 行为是确定的。
; ---------------------------------------------------------------------------

; 前台跑,日志走 stderr,由 systemd/journald 收走。
; 别往文件里猛写日志 —— 小 VPS 的磁盘配额比你想的小。
;
; ⚠️ **故意不写 `output = /dev/stdout`。** 在 systemd 下 StandardOutput=journal 时,
; /dev/stdout 指向的是 journald 的 unix socket,stunnel 会拿它当普通文件去 open(),
; 在 socket 上失败(ENXIO),然后整个服务起不来。前台模式默认就往 stderr 打,
; journald 照样收得到 —— 什么都不配是对的。
;
; ⚠️ **stunnel 的配置解析器不支持行尾注释。** `debug = 4   ; 说明` 会把
; "4   ; 说明" 整个当成值,然后报 "Illegal debug level" 直接拒绝启动。
; 注释必须独占一行 —— 这整个文件里都不要在指令后面跟 `;`。
;
; debug 取值 0~7,调通之后可以降到 3。
foreground = yes
debug = 4

; 绑 443 要 root;绑完 stunnel 自己降权到 stunnel4(这个用户由 stunnel4 包创建)。
setuid = stunnel4
setgid = stunnel4

; 不写 pid 文件 —— 前台模式下 systemd 直接盯进程,不需要。
pid =

; 不要 chroot。chroot 之后 DNS/时间/日志都要单独伺候,收益为零。

[esp32-voice]
accept  = 0.0.0.0:443
connect = 127.0.0.1:8765

; --- PSK ---
; 一行一台设备:  identity:64位hex
; stunnel 会自动把 hex 转成二进制,和设备侧 setPreSharedKey(ident, keyHex) 对得上。
; 权限必须是 600 且属主是 stunnel4,否则 stunnel 拒绝启动(它是对的)。
PSKsecrets = /etc/stunnel/psk.secrets

; --- 版本 ---
; **必须钉死 TLS 1.2。** 设备侧 CONFIG_MBEDTLS_SSL_PROTO_TLS1_3 **没开**
; (arduino-esp32 3.3.12 的预编译 IDF),设备根本不会 TLS 1.3。
; 不钉的话 OpenSSL 会优先提 1.3,然后降级协商 —— 能通,但多一轮往返,
; 而且哪天 OpenSSL 默认不再回落 1.2 就会静默坏掉。
sslVersionMin = TLSv1.2
sslVersionMax = TLSv1.2

; --- 套件 ---
; 只留**纯 PSK**。不能让 OpenSSL 选中 RSA-PSK —— 那个会下发证书链,
; 而设备侧走 PSK 分支时没装 CA(ssl_client.cpp 里 CA/PSK 是互斥的 else-if),验证必挂。
; 设备侧 ECDHE-PSK 也是开的,想要前向保密可以把 ECDHE-PSK-* 放最前面,
; 代价是 C3 没有硬件 ECC,每次握手多花几十 ms。长连接场景握手不频繁,值得考虑。
ciphers = PSK-AES128-GCM-SHA256:PSK-AES256-GCM-SHA384:PSK-AES128-CBC-SHA256

; TCP_NODELAY:100 ms 一包的音频,不能让 Nagle 压着(设备侧也设了 setNoDelay)
socket = l:TCP_NODELAY=1
socket = r:TCP_NODELAY=1

; 保活。公网 NAT 会回收空闲连接,而 PTT 设备大部分时间是空闲的。
socket = a:SO_KEEPALIVE=1
